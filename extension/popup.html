<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <title>Fluent</title>
    <style>
      * {
        box-sizing: border-box;
      }
      body {
        width: 340px;
        margin: 0;
        padding: 22px;
        background: #fdfaf4;
        color: #1c1612;
        font: 13px/1.5 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      }
      h1 {
        font: italic 700 24px/1.2 Georgia, "Times New Roman", serif;
        color: #c85a3a;
        margin: 0 0 8px;
      }
      p.tagline {
        color: #7a6f62;
        margin: 0 0 22px;
        font-size: 12.5px;
        line-height: 1.5;
      }
      .field {
        margin-bottom: 12px;
      }
      .field label {
        display: block;
        font: 700 9px/1 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
        letter-spacing: 0.08em;
        text-transform: uppercase;
        color: #7a6f62;
        margin-bottom: 6px;
      }
      select {
        width: 100%;
        padding: 9px 10px;
        border-radius: 9px;
        border: 1px solid rgba(28, 22, 18, 0.15);
        background: #fff;
        color: #1c1612;
        font: 13px -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      }
      .section-desc {
        color: #7a6f62;
        font-size: 12.5px;
        line-height: 1.5;
        margin: 0 0 12px;
      }
      .btn {
        display: block;
        width: 100%;
        text-align: center;
        border: none;
        border-radius: 9999px;
        padding: 14px 18px;
        font-weight: 700;
        font-size: 13.5px;
        font-family: inherit;
        cursor: pointer;
        text-decoration: none;
        transition: background-color 0.15s ease;
      }
      .btn:disabled {
        opacity: 0.6;
        cursor: default;
      }
      .btn-dark {
        background: #1c1612;
        color: #fdfaf4;
      }
      .btn-dark:hover {
        background: #2a221c;
      }
      .btn-accent {
        background: #c85a3a;
        color: #fdfaf4;
      }
      .btn-accent:hover {
        background: #b34e30;
      }
      .btn[data-active="true"] {
        background: #1c1612;
      }
      hr.divider {
        border: none;
        border-top: 1px solid rgba(28, 22, 18, 0.1);
        margin: 20px 0;
      }
      .clipboard-result {
        background: #fff;
        border: 1px solid rgba(28, 22, 18, 0.12);
        border-radius: 10px;
        padding: 10px 12px;
        margin-top: 10px;
      }
      .clipboard-result__source {
        font-size: 11px;
        color: #7a6f62;
        margin: 0 0 4px;
        max-height: 3.6em;
        overflow: hidden;
      }
      .clipboard-result__translated {
        font: italic 600 15px/1.35 Georgia, "Times New Roman", serif;
        color: #c85a3a;
        margin: 0 0 4px;
      }
      .clipboard-result__phonetic {
        font: 11px/1.4 ui-monospace, "SF Mono", Consolas, monospace;
        color: #7a6f62;
        margin: 0 0 8px;
      }
      button.clipboard-result__copy {
        background: transparent;
        border: 1px solid rgba(28, 22, 18, 0.15);
        border-radius: 9999px;
        padding: 5px 12px;
        font: 500 11px/1 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
        color: #1c1612;
        cursor: pointer;
        font-family: inherit;
      }
      button.clipboard-result__copy:hover {
        background: rgba(28, 22, 18, 0.05);
      }
    </style>
  </head>
  <body>
    <h1>Fluent</h1>
    <p class="tagline">Highlight text on any page to translate it — or right-click a selection.</p>

    <div class="field">
      <label for="target-lang">Translate into</label>
      <select id="target-lang"></select>
    </div>
    <a class="btn btn-dark" id="open-app" href="#" target="_blank">Open Fluent →</a>

    <hr class="divider" />

    <p class="section-desc" id="live-status">Live-interpret whatever video/audio is playing in this tab.</p>
    <div class="field">
      <label for="source-lang">Speaking</label>
      <select id="source-lang"></select>
    </div>
    <button class="btn btn-accent" id="live-toggle" type="button">
      <span class="action-row__title">Start live interpreting this tab</span>
    </button>

    <hr class="divider" />

    <p class="section-desc" id="clipboard-status">Translate whatever's on your clipboard right now.</p>
    <button class="btn btn-dark" id="clipboard-translate" type="button">📋 Translate clipboard</button>

    <div class="clipboard-result" id="clipboard-result" hidden>
      <p class="clipboard-result__source" id="clipboard-source"></p>
      <p class="clipboard-result__translated" id="clipboard-translated"></p>
      <p class="clipboard-result__phonetic" id="clipboard-phonetic" hidden></p>
      <button class="clipboard-result__copy" id="clipboard-copy" type="button">Copy translation</button>
    </div>

    <script src="popup.js"></script>
  </body>
</html>
