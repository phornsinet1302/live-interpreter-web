services:
  - type: web
    name: live-interpreter-back
    runtime: docker
    dockerfilePath: ./backend/Dockerfile
    dockerContext: .
    plan: free
    preDeployCommand: pnpm --filter backend db:migrate
    envVars:
      - key: NODE_ENV
        value: production
      # Neon Postgres, set manually in the Render dashboard (not a Render-managed DB).
      - key: DATABASE_URL
        sync: false
      - key: CLERK_SECRET_KEY
        sync: false
      - key: CLERK_PUBLISHABLE_KEY
        sync: false
      - key: GOOGLE_API_KEY
        sync: false
      - key: OPENAI_API_KEY
        sync: false
      - key: CORS_ORIGINS
        sync: false
